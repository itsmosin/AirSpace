# ==========================================================================
# CRE SECRETS FILE — AirSpace verifier
# ==========================================================================
# Maps the secret id the workflow requests with runtime.getSecret({ id })
# to the environment variable that holds its value. No values live here.
#
# Simulation: the CRE CLI reads the variable from cre/.env.
# Deployment: upload with `cre secrets create ./airspace-verifier --target <target>`;
# the Vault DON releases it only into the attested enclave.
secretsNames:
  ANTHROPIC_API_KEY:
    - ANTHROPIC_API_KEY
