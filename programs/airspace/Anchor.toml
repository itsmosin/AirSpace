[toolchain]
anchor_version = "0.32.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
airspace = "5PNnqSxWCktbS7pUtt5MXCuQEVfztjYuLpvVvbB3oxeZ"

[programs.devnet]
airspace = "5PNnqSxWCktbS7pUtt5MXCuQEVfztjYuLpvVvbB3oxeZ"

[provider]
